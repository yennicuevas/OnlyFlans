
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Bienvenido a onlyflans</title>

    <style>.turquesa{background-color: #1abc9c; } </style>
</head>
<body>
    <div class="container text-white p-3 text-center">
        {% include 'header.html' %}
    </div>

    <div class="container bg-warning p-2">
        {% include 'navbar.html' %}
    </div>

    <div class="container my-4">
            {% if request.GET.bye %}                 
                <div class ="alert alert-success">Has cerrado sesión exitosamente!
                Gracias por visitarnos. Esperamos verte pronto de vuelta.</div>
            {%endif%}
        {% block content %}
        {% endblock %}
    </div>

    <div class="container turquesa text-dark p-3 text-center">
        {% include 'footer.html' %}
    </div>

</body>
</html>
